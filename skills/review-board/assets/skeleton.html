<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review board</title>
<!-- Colours: VS Code Dark Modern. Icons: Codicons by Microsoft, CC BY 4.0, https://github.com/microsoft/vscode-codicons -->
<style>
:root {
  --bg: #1f1f1f;
  --side: #181818;
  --fg: #cccccc;
  --bright: #ffffff;
  --card: #202020;
  --dim: #9d9d9d;
  --accent: #0078d4;
  --accent-hover: #026ec1;
  --focus: #0078d4;
  --link: #4daafc;
  --mauve: #37373d;
  --hover: #2a2d2e;
  --selected: #04395e;
  --line: #2b2b2b;
  --widget-line: #313131;
  --input: #313131;
  --input-line: #3c3c3c;
  --placeholder: #989898;
  --badge: #616161;
  --badge-fg: #f8f8f8;
  --toolbar-hover: #5a5d5e50;
  --destructive: #f85149;
  --success: #81b88b;
  --warning: #e2c08d;
  --info: #4daafc;
  --renamed: #73c991;
  --deleted: #c74e39;
  --icon-error: #f14c4c;
  --icon-warning: #cca700;
  --icon-info: #3794ff;
  --icon-pass: #73c991;
  --guide: #585858;
  --line-number: #6e7681;
  --diff-added: #9ccc2c;
  --diff-removed: #ff0000;
  --r: 2px;
  --row: 22px;
  --sidebar-w: 280px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe WPC', 'Segoe UI', system-ui, Ubuntu, 'Droid Sans', sans-serif;
  --mono: Menlo, Monaco, 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 13px/1.4 var(--font); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.codicon { width: 16px; height: 16px; flex: none; }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--badge); color: var(--badge-fg); font: 400 11px/18px var(--font); flex: none; }
.ibtn { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; color: var(--fg); flex: none; }
.ibtn:hover { background: var(--toolbar-hover); }
.ibtn[aria-pressed="true"] { background: #2489db82; outline: 1px solid #2488db; outline-offset: -1px; }
.ibtn[aria-pressed="true"]:focus-visible { outline-color: var(--focus); }
.sev-high { color: var(--icon-error); }
.sev-medium { color: var(--icon-warning); }
.sev-low { color: var(--icon-info); }
.add { color: var(--success); }
.del { color: var(--destructive); }
.s-A, .s-A .name { color: var(--success); }
.s-M, .s-M .name { color: var(--warning); }
.s-D, .s-D .name { color: var(--deleted); }
.s-R, .s-R .name { color: var(--renamed); }
.tone-destructive { color: var(--destructive); } .tone-warning { color: var(--warning); } .tone-info { color: var(--info); } .tone-success { color: var(--success); } .tone-dim { color: var(--dim); }

.workbench { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) 22px; }

.top { grid-row: 1; display: grid; gap: 6px; padding: 8px 12px; background: var(--side); border-bottom: 1px solid var(--line); min-width: 0; }
.toprow { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.top h1 { margin: 0; display: inline-flex; align-items: center; gap: 6px; font: 600 13px/22px var(--font); color: var(--bright); min-width: 0; flex: none; max-width: 50%; }
.top h1 .codicon { color: var(--dim); }
.top h1 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .lead { margin: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips:empty { display: none; }
.step { display: inline-flex; align-items: center; gap: 8px; height: 24px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); white-space: nowrap; min-width: 0; max-width: 100%; cursor: pointer; font-size: 12px; }
.step:hover { border-color: var(--dim); }
.step.on { border-color: var(--accent); background: var(--selected); color: var(--bright); }
.step .t { font-weight: 600; }
.step .dim { overflow: hidden; text-overflow: ellipsis; }

.body { grid-row: 2; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 0; overflow: hidden; }
.sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tree { overflow: auto; flex: 1 1 auto; min-height: 0; padding: 6px 0 16px; outline: none; }
.tree:not(:hover) { --guide: transparent; }
.row { display: flex; align-items: center; height: var(--row); line-height: var(--row); padding-right: 12px; min-width: 0; cursor: pointer; white-space: nowrap; user-select: none; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--mauve); }
.tree:focus-within .row.sel { background: var(--selected); color: var(--bright); }
.row.cur { outline: 1px solid var(--focus); outline-offset: -1px; }
.row .twistie { width: 16px; height: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--fg); }
.row .name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding-left: 2px; }
.row .viewed { width: 14px; height: 14px; margin: 0 6px 0 0; accent-color: var(--accent); cursor: pointer; flex: none; }
.row .deco { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding-left: 8px; flex: none; }
.row .st { width: 16px; text-align: center; font-size: 12px; font-weight: 600; flex: none; }
.row.group { margin-top: 4px; }
.row.group .name { font-size: 11px; font-weight: 700; text-transform: uppercase; }
.row.group .badge { margin-left: 6px; }
.row.group .hintlabel { margin-left: 8px; font-size: 11px; color: var(--dim); text-transform: none; font-weight: 400; }
.row.file.t-core .name { font-weight: 600; }
.row.file.s-D .name { text-decoration: line-through; }
.row.t-tests .name, .row.t-generated .name, .row.t-tests .deco, .row.t-generated .deco { opacity: 0.6; }
.row.isviewed .name, .row.isviewed .deco { opacity: 0.5; }
.setbadge { font: 400 11px/var(--row) var(--mono); color: var(--dim); }
.empty-tree { padding: 8px 16px; color: var(--dim); }

.editor { display: grid; grid-template-rows: 35px auto minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--bg); }
.tabbar { display: flex; background: var(--side); border-bottom: 1px solid var(--line); min-width: 0; }
.tabs { display: flex; flex: 1 1 auto; min-width: 0; overflow: hidden; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 35px; padding: 0 8px 0 12px; border-right: 1px solid var(--line); color: var(--dim); background: var(--side); cursor: pointer; user-select: none; white-space: nowrap; flex: 0 1 auto; max-width: 320px; min-width: 0; }
.tab:hover { background: var(--bg); }
.tab.on { background: var(--bg); color: var(--bright); box-shadow: inset 0 1px 0 var(--accent); }
.tab .codicon { color: var(--dim); }
.tab .label { overflow: hidden; text-overflow: ellipsis; }
.tab .desc { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.tab .st { font-size: 11px; font-weight: 600; }
.tab-close { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; color: inherit; margin-right: -2px; }
.tab-close:hover { background: #ffffff1a; }
.editor-actions { display: flex; align-items: center; gap: 2px; padding: 0 8px; flex: none; }
.editor-actions .seg { display: inline-flex; gap: 2px; margin: 0 4px; }
.filebar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 26px; padding: 2px 12px; font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--line); min-width: 0; }
.filebar:empty { display: none; }
.filebar .flag { font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.filebar .flag .codicon { width: 14px; height: 14px; }
.filebar .note { color: var(--fg); overflow-wrap: anywhere; }
.filebar .right { margin-left: auto; display: inline-flex; gap: 12px; align-items: center; white-space: nowrap; }
.editor-body { overflow: auto; min-height: 0; position: relative; }
.diffwrap { min-width: 0; padding-bottom: 40vh; --diffs-dark-bg: var(--bg); --diffs-dark: var(--fg); --diffs-dark-addition-color: var(--diff-added); --diffs-dark-deletion-color: var(--diff-removed); --diffs-dark-modified-color: var(--accent); --diffs-fg-number-override: var(--line-number); --diffs-bg-separator-override: #262626; --diffs-font-family: var(--mono); --diffs-font-size: 12px; --diffs-line-height: 18px; }
.diffnote { padding: 24px; color: var(--dim); }
.emptystate { padding: 48px 24px; color: var(--dim); text-align: center; }

.ov { padding: 16px 24px 48px; max-width: 1100px; }
.ov-set + .ov-set, .ov-board { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 16px; }
.ov-head h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--bright); overflow-wrap: anywhere; }
.ov-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; color: var(--dim); margin-top: 2px; font-size: 12px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px 40px; margin-top: 12px; }
.ov-sec { min-width: 0; }
.ov-sec h3 { margin: 0 0 2px; height: 22px; display: flex; align-items: center; gap: 6px; font: 700 11px/22px var(--font); text-transform: uppercase; color: var(--fg); }
.ov-sec h3 .dim { text-transform: none; font-weight: 400; }
.ov-sec .hint { margin: 0; padding: 0 8px; color: var(--dim); line-height: 22px; }
.list { margin: 0; padding: 0; list-style: none; }
.item { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-height: 22px; padding: 0 8px; min-width: 0; }
.item:hover { background: var(--hover); }
.item .n { width: 16px; color: var(--dim); font-size: 11px; text-align: right; flex: none; }
.item .link { color: var(--fg); font-weight: 600; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; line-height: 22px; }
.item .link:hover { text-decoration: underline; }
.item .noref { color: var(--dim); font-family: var(--mono); font-size: 12px; }
.item .desc { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.item .flags { display: inline-flex; flex-wrap: wrap; gap: 0 10px; font-size: 12px; font-weight: 600; }
.item .note { flex: 1 1 100%; color: var(--dim); padding: 0 0 4px 24px; overflow-wrap: anywhere; }
.item .fid { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.item .text { flex: 1 1 100%; min-width: 0; overflow-wrap: anywhere; padding: 0 0 4px 24px; color: var(--fg); }
.item .text.inline { flex: 1 1 auto; padding: 0; }
.item > .codicon { flex: none; }
.sub { margin: 0 0 4px; padding: 0; list-style: none; flex: 1 1 100%; }
.sub .item { padding-left: 24px; }
.sub .item:hover { background: none; }
.res-pass { color: var(--icon-pass); }
.res-warn { color: var(--icon-warning); }
.vrow { display: grid; grid-template-columns: 16px auto minmax(0, 1fr); gap: 8px; align-items: center; min-height: 22px; padding: 0 8px; }
.vrow:hover { background: var(--hover); }
.vrow .check { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.vrow .result { overflow-wrap: anywhere; }
.dec { padding: 2px 8px 8px; }
.dec + .dec { border-top: 1px solid var(--line); }
.dec .q { font-weight: 600; color: var(--fg); overflow-wrap: anywhere; min-height: 22px; line-height: 22px; }
.dec ol { margin: 0; padding-left: 18px; }
.dec li { line-height: 22px; }
.disclosure { margin-top: 8px; }
.disclosure summary { list-style: none; display: flex; align-items: center; gap: 2px; height: 22px; cursor: pointer; color: var(--dim); user-select: none; }
.disclosure summary:hover { color: var(--fg); }
.disclosure summary::-webkit-details-marker { display: none; }
.disclosure summary .twistie { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; }
.disclosure[open] > summary .twistie .codicon { transform: rotate(90deg); }
.md { padding: 4px 0 8px 18px; display: grid; gap: 6px; max-width: 75ch; }
.md p { margin: 0; }
.md .mdh { font-weight: 600; color: var(--bright); margin-top: 4px; }
.md ul, .md ol { margin: 0; padding-left: 20px; display: grid; gap: 2px; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--input-line); color: #d0d0d0; border-radius: var(--r); padding: 0 4px; }
.commits { margin: 0; padding: 0 0 8px 18px; list-style: none; }
.commits li { height: 22px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.statusbar { grid-row: 3; display: flex; align-items: stretch; background: var(--side); border-top: 1px solid var(--line); font-size: 12px; color: var(--fg); min-width: 0; overflow: hidden; }
.sb { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; white-space: nowrap; color: inherit; height: 22px; line-height: 22px; flex: none; }
.sb .codicon { width: 14px; height: 14px; }
button.sb:hover { background: #f1f1f133; color: var(--bright); }
.sb.remote { background: var(--accent); color: #ffffff; padding: 0 8px; }
.sb.hint { color: var(--dim); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.sb-right { margin-left: auto; display: inline-flex; min-width: 0; }

textarea { background: var(--input); border: 1px solid var(--input-line); border-radius: var(--r); color: var(--fg); padding: 6px 8px; resize: vertical; width: 100%; }
textarea:focus { outline: 1px solid var(--focus); outline-offset: -1px; border-color: var(--focus); }
::placeholder { color: var(--placeholder); }
.btn { background: var(--accent); color: #ffffff; border: 1px solid #ffffff1a; border-radius: var(--r); padding: 3px 11px; line-height: 18px; display: inline-flex; align-items: center; gap: 4px; }
.btn:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--input-line); }
.btn.ghost:hover { background: var(--line); }
.pill { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.pill.queued { color: var(--icon-pass); }
.inline-answer { font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; padding: 6px 8px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ask { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; font-size: 12px; color: var(--fg); border: 1px solid var(--input-line); border-radius: var(--r); }
.ask:hover { background: var(--toolbar-hover); }
.askpanel { margin: 4px 0; background: var(--card); border: 1px solid var(--widget-line); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 6px; width: 100%; min-width: 0; text-align: left; font: 400 13px/1.4 var(--font); box-shadow: 0 2px 8px #0000005c; }
.askref { font-size: 12px; font-family: var(--mono); color: var(--dim); overflow-wrap: anywhere; }
.seltool { position: absolute; z-index: 60; background: var(--card); border: 1px solid var(--widget-line); border-radius: var(--r); padding: 6px 8px; display: grid; gap: 6px; max-width: min(560px, calc(100vw - 16px)); min-width: 0; box-shadow: 0 2px 8px #0000005c; font-size: 12px; }
.seltool .selrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seltool .selrow .mono { margin-right: 4px; }
.annot { margin: 4px 12px 4px 0; padding: 6px 10px; background: var(--card); border: 1px solid var(--widget-line); border-radius: var(--r); font: 400 13px/1.4 var(--font); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.annot .text { flex: 1 1 100%; }

@media (max-width: 1100px) { :root { --sidebar-w: 240px; } }
@media (max-width: 899px) {
  body { overflow: auto; }
  .workbench { height: auto; display: block; }
  .body { display: block; overflow: visible; }
  .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
  .tree { max-height: 50vh; }
  .editor { display: block; }
  .editor-body { overflow: visible; min-height: 40vh; }
  .diffwrap { padding-bottom: 0; }
  .statusbar { flex-wrap: wrap; }
  .sb-right { margin-left: 0; flex-wrap: wrap; }
  .ov { padding: 12px 16px 24px; }
  .toprow { flex-wrap: wrap; gap: 2px 12px; }
  .top h1 { max-width: 100%; }
  .top .lead { white-space: normal; }
}
</style>
</head>

const esc = (value) =>
  String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
const icon = (name, cls = '') => '<svg class="codicon' + (cls ? ' ' + cls : '') + '" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">' + (ICONS[name] ?? '') + '</svg>';

const dirName = (path) => path.split('/').slice(0, -1).join('/');

  const parts = path.split('/');

const fmtTokens = (n) => (n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(0) + 'k' : String(n));
const fmtMs = (ms) => {
  const s = Math.round(ms / 1000);
  return s >= 3600 ? Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm' : s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's';

const inlineMarkdown = (text) =>
  esc(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

function renderMarkdown(text) {
  const blocks = [];
  let list = null;
  const closeList = () => {
    if (list) blocks.push('<' + list.tag + '>' + list.items.join('') + '</' + list.tag + '>');
    list = null;
  };
  const pushItem = (tag, item) => {
    if (!list || list.tag !== tag) {
      closeList();
      list = { tag, items: [] };
    }
    list.items.push('<li>' + inlineMarkdown(item) + '</li>');
  };
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    const heading = /^(#{1,6})\s+(.*)$/.exec(line);
    const bullet = /^\s*[-*]\s+(.*)$/.exec(line);
    const numbered = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (heading) {
      closeList();
      blocks.push('<p class="mdh">' + inlineMarkdown(heading[2]) + '</p>');
    } else if (bullet) pushItem('ul', bullet[1]);
    else if (numbered) pushItem('ol', numbered[1]);
    else if (!line.trim()) closeList();
    else {
      closeList();
      blocks.push('<p>' + inlineMarkdown(line) + '</p>');
    }
  }
  closeList();
  return blocks.join('');
}

function askPrompt(ctx, text) {
  const kind = ctx.tag === 'change-request' ? 'Change request' : 'Question';
  return kind + ' about ' + ctx.what + ' (change set ' + ctx.set + ', ' + ctx.file + ':' + ctx.start + '-' + ctx.end + '): ' + text +
    '\n\nSelected code (' + ctx.side + ' side, lines ' + ctx.start + '-' + ctx.end + '):\n```\n' + ctx.code + '\n```';
}

function queueAsk(ctx, text, form) {
  const prompt = askPrompt(ctx, text);
  const label = (ctx.tag === 'change-request' ? 'Change: ' : 'Q: ') + ctx.ref;
  if (window.lavish) {
    window.lavish.queuePrompt(prompt, { tag: ctx.tag, text: label, element: form, data: { ...ctx, question: text } });
    form.innerHTML = '<span class="pill queued">' + icon('check') + 'queued</span>';
    setTimeout(() => clearSelection(), 1200);
    return;
  }
  form.innerHTML = '<div class="inline-answer">' + esc(prompt) + '</div><div class="actions"><button type="button" class="btn ghost" data-ask-cancel>Close</button></div>';
}

function openAskPanel(button) {

const newDir = (name) => ({ name, dirs: new Map(), files: [] });

function buildTree(entries) {
  const root = newDir('');
  for (const entry of entries) {
    const parts = entry.file.path.split('/');
    let node = root;
    for (const dir of parts.slice(0, -1)) {
      if (!node.dirs.has(dir)) node.dirs.set(dir, newDir(dir));
      node = node.dirs.get(dir);
    }
    node.files.push(entry);
  }
  return root;
}

function compact(node, parentPath) {
  let current = node;
  let label = node.name;
  while (current.files.length === 0 && current.dirs.size === 1) {
    current = [...current.dirs.values()][0];
    label += '/' + current.name;
  }
  return { node: current, label, path: parentPath ? parentPath + '/' + label : label };
}

function fileRow(entry, depth, showSet) {
  const { file, key, set } = entry;
  const classes = ['row', 'file', 't-' + file.tier, 's-' + file.status];
  if (state.viewed.has(key)) classes.push('isviewed');
  if (state.file === key) classes.push('sel');
  if (state.cursorKey === key) classes.push('cur');
  const title = file.oldPath ? file.oldPath + ' → ' + file.path : file.path;
  const findings = set.findings.filter((finding) => finding.fileIndex === set.files.indexOf(file)).length;
  return (
    '<div class="' + classes.join(' ') + '" role="treeitem" aria-selected="' + (state.file === key) + '" data-lavish-action="open-file" data-key="' + key + '" style="' + indentStyle(depth) + '" title="' + esc(title) + '">' +
    '<span class="twistie"></span>' +
    '<input type="checkbox" class="viewed" data-viewed="' + key + '" title="Viewed" aria-label="Viewed"' + (state.viewed.has(key) ? ' checked' : '') + '>' +
    '<span class="name">' + esc(baseName(file.path)) + '</span>' +
    '<span class="deco">' +
    (findings ? '<span class="badge" title="' + plural(findings, 'finding') + '">' + findings + '</span>' : '') +
    (showSet ? '<span class="setbadge">' + esc(setName(set)) + '</span>' : '') +
    '<span class="st" title="' + STATUS_LABEL[file.status] + '">' + file.status + '</span></span></div>'
  );
}

function folderRows(node, depth, parentPath, showSet) {
  const dirs = [...node.dirs.values()].sort((a, b) => a.name.localeCompare(b.name)).map((dir) => compact(dir, parentPath));
  const html = [];
  for (const dir of dirs) {
    const id = state.set + ':' + dir.path;
    const collapsed = state.collapsed.has(id);
    html.push(
      '<div class="row folder" role="treeitem" data-lavish-action="toggle-folder" aria-expanded="' + !collapsed + '" data-folder="' + esc(id) + '" style="' + indentStyle(depth) + '" title="' + esc(dir.path) + '">' +
      '<span class="twistie">' + icon(collapsed ? 'chevron-right' : 'chevron-down') + '</span><span class="name">' + esc(dir.label) + '</span></div>',
    );
    if (!collapsed) html.push(folderRows(dir.node, depth + 1, dir.path, showSet));
  }
  const files = [...node.files].sort((a, b) => baseName(a.file.path).localeCompare(baseName(b.file.path)));
  for (const entry of files) html.push(fileRow(entry, depth, showSet));
  return html.join('');
}

const reviewable = (file) => file.tier === 'core' || file.tier === 'supporting';
const riskScore = (file) => file.flags.reduce((sum, flag) => sum + FLAG_META[flag].weight, 0) + Math.min((file.adds + file.dels) / 100, 3);

function readFirst(set) {
  if (set.startHere.length) return { auto: false, indices: set.startHere };
  const scored = set.files
    .map((file, index) => ({ index, score: riskScore(file) }))
    .filter(({ index }) => reviewable(set.files[index]))
    .sort((a, b) => b.score - a.score);
  return { auto: true, indices: scored.map((entry) => entry.index) };
}

const findingItem = (set) => (finding) =>
  '<li class="item" data-finding="' + esc(finding.id) + '">' + sevIcon(finding.severity) + '<span class="fid">' + esc(finding.id) + '</span>' +
  (finding.line && finding.fileIndex >= 0 ? fileLink(set, finding.fileIndex, 'line ' + finding.line, ' data-finding-id="' + esc(finding.id) + '"') : '') +
  '<span class="text inline">' + esc(finding.text) + '</span></li>';

function checkSection(set, compactView) {
  const byFile = new Map();
  set.files.forEach((file, index) => {
    if (file.flags.length) byFile.set(index, { index, file, findings: [] });
  });
  const loose = [];
  for (const finding of set.findings) {
    if (finding.fileIndex >= 0) {
      if (!byFile.has(finding.fileIndex)) byFile.set(finding.fileIndex, { index: finding.fileIndex, file: set.files[finding.fileIndex], findings: [] });
      byFile.get(finding.fileIndex).findings.push(finding);
    } else loose.push(finding);
  }
  const severity = (entry) => Math.min(...entry.findings.map((finding) => SEVERITY_ORDER[finding.severity] ?? 3), 3);
  const entries = [...byFile.values()].sort((a, b) => severity(a) - severity(b) || riskScore(b.file) - riskScore(a.file));
  if (!entries.length && !loose.length) {
    const note = DATA.meta.depth === 'light' ? 'Nothing flagged by path. Code review was not run on this light board.' : 'Nothing flagged by path. Code review found nothing to report.';
    return section('Check carefully', '<p class="hint">' + note + '</p>');
  }
  const item = (entry) =>
    '<li class="item">' + fileRef(set, entry.index) +
    (entry.file.flags.length ? '<span class="flags">' + entry.file.flags.map(flagHtml).join('') + '</span>' : '') +
    (entry.findings.length ? '<ul class="sub">' + [...entry.findings].sort((a, b) => (SEVERITY_ORDER[a.severity] ?? 3) - (SEVERITY_ORDER[b.severity] ?? 3)).map(findingItem(set)).join('') + '</ul>' : '') +
    '</li>';
  const looseHtml = loose.length ? '<ul class="list">' + loose.map(findingItem(set)).join('') + '</ul>' : '';
  const note = DATA.meta.depth === 'light' ? '<p class="hint">Code review was not run on this light board; these are path flags only.</p>' : '';
  return section('Check carefully', more(entries, compactView ? 3 : entries.length, item) + looseHtml + note);
}

const patchHasHunks = (file) => file.patch.includes('\n@@ ');

function excerpt(patch, side, start, end) {
  const out = [];
  let oldN = 0;
  let newN = 0;
  let inHunk = false;
  for (const line of patch.split('\n')) {
    const hunk = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
    if (hunk) {
      oldN = Number(hunk[1]);
      newN = Number(hunk[2]);
      inHunk = true;
      continue;
    }
    if (!inHunk || line.startsWith('\\')) continue;
    const tag = line[0];
    const text = line.slice(1);
    if (tag === '+') {
      if (side === 'additions' && newN >= start && newN <= end) out.push(text);
      newN++;
    } else if (tag === '-') {
      if (side === 'deletions' && oldN >= start && oldN <= end) out.push(text);
      oldN++;
    } else {
      const n = side === 'additions' ? newN : oldN;
      if (n >= start && n <= end) out.push(text);
      oldN++;
      newN++;
    }
  }
  return out.join('\n');
}

const diffRoot = () => document.querySelector('#diffmount diffs-container')?.shadowRoot ?? null;
const contentLines = (root) => [...root.querySelectorAll('[data-content] [data-line]')];
function lineElementOf(container, offset, isEnd) {
  const direct = (container.nodeType === 1 ? container : container.parentElement)?.closest('[data-line]');
  if (direct) return direct;
  if (container.nodeType !== 1) return null;
  const child = container.childNodes[isEnd ? Math.max(0, offset - 1) : Math.min(offset, container.childNodes.length - 1)];
  if (!child) return null;
  if (child.nodeType === 1 && child.matches('[data-line]')) return child;
  return child.nodeType === 1 ? (child.querySelector('[data-line]') ?? child.closest('[data-line]')) : null;
}

function rangeFromLines(root, lines, startEl, endEl) {
  const startIndex = lines.indexOf(startEl);
  const endIndex = lines.indexOf(endEl);
  if (startIndex < 0 || endIndex < 0) return null;
  const [from, to] = startIndex <= endIndex ? [startIndex, endIndex] : [endIndex, startIndex];
  const span = lines.slice(from, to + 1);
  const allDeleted = span.every((el) => el.dataset.lineType === 'change-deletion');
  const side = allDeleted ? 'deletions' : 'additions';
  const otherSide = side === 'additions' ? 'change-deletion' : 'change-addition';
  const numberOf = (el) => (el.dataset.lineType === otherSide ? (el.dataset.altLine ? Number(el.dataset.altLine) : null) : Number(el.dataset.line));
  const numbers = span.map(numberOf).filter((n) => Number.isFinite(n));
  if (!numbers.length) return null;
  return { side, start: Math.min(...numbers), end: Math.max(...numbers), anchor: lines[to] };
}

function selectionInDiff() {
  const root = diffRoot();
  if (!root || !state.file) return null;
  const shadowSelection = root.getSelection?.();
  let range = null;
  let text = '';
  if (shadowSelection && shadowSelection.rangeCount && !shadowSelection.isCollapsed) {
    range = shadowSelection.getRangeAt(0);
    text = shadowSelection.toString();
  } else {
    const selection = document.getSelection();
    if (!selection || selection.isCollapsed) return null;
    range = selection.getComposedRanges?.({ shadowRoots: [root] })[0] ?? null;
    text = selection.toString();
  }
  if (!range || !text.trim()) return null;
  const startEl = lineElementOf(range.startContainer, range.startOffset, false);
  const endEl = lineElementOf(range.endContainer, range.endOffset, true);
  if (!startEl || !endEl || !root.contains(startEl) || !root.contains(endEl)) return null;
  const lines = rangeFromLines(root, contentLines(root), startEl, endEl);
  if (!lines) return null;
  return { ...lines, code: text.replace(/\n{3,}/g, '\n\n').trimEnd() };
}

let selectionToolbar = null;
let toolbarAnchor = null;

function hideSelectionToolbar() {
  selectionToolbar?.remove();
  selectionToolbar = null;
  toolbarAnchor = null;
}

function positionToolbar() {
  if (!selectionToolbar || !toolbarAnchor) return;
  const rect = toolbarAnchor.getBoundingClientRect();
  const width = selectionToolbar.offsetWidth;
  selectionToolbar.style.top = rect.bottom + window.scrollY + 6 + 'px';
  selectionToolbar.style.left = Math.max(8, Math.min(rect.left + window.scrollX, window.scrollX + window.innerWidth - width - 8)) + 'px';
}

function showSelectionToolbar(selection) {
  const { set, file } = lookup(state.file);
  const ref = displayName(file.path) + ':' + selection.start + (selection.end !== selection.start ? '-' + selection.end : '');
  const ctx = { what: 'selected code', ref, set: set.id, file: file.path, side: selection.side, start: selection.start, end: selection.end, code: selection.code };
  hideSelectionToolbar();
  selectionToolbar = document.createElement('div');
  selectionToolbar.className = 'seltool';
  selectionToolbar.innerHTML =
    '<div class="selrow"><span class="mono">' + esc(ref) + ' <span class="dim">' + (selection.side === 'additions' ? 'new' : 'old') + '</span></span>' +
    askButton({ ...ctx, tag: 'question' }, 'Ask about this') + askButton({ ...ctx, tag: 'change-request' }, 'Request change') +
    '<button type="button" class="ibtn" data-sel-clear title="Dismiss" aria-label="Dismiss">' + icon('close') + '</button></div>';
  document.body.appendChild(selectionToolbar);
  toolbarAnchor = selection.anchor;
  positionToolbar();
}

function onSelection(key, range) {
  if (state.file !== key) return;
  if (!range) {
    if (!selectionToolbar?.querySelector('.askpanel')) hideSelectionToolbar();
    return;
  }
  const { file } = lookup(key);
  const start = Math.min(range.start, range.end);
  const end = Math.max(range.start, range.end);
  const side = range.side ?? (file.status === 'D' ? 'deletions' : 'additions');
  const root = diffRoot();
  const anchor = root ? contentLines(root).find((el) => Number(el.dataset.line) === end && (side === 'deletions') === (el.dataset.lineType === 'change-deletion')) ?? contentLines(root).find((el) => Number(el.dataset.line) === end) : null;
  if (!anchor) return;
  showSelectionToolbar({ side, start, end, anchor, code: excerpt(file.patch, side, start, end) });
}

function updateSelectionToolbar(event) {
  if (selectionToolbar && event.composedPath().includes(selectionToolbar)) return;
  const selection = selectionInDiff();
  if (selection) showSelectionToolbar(selection);
  else if (!selectionToolbar?.querySelector('.askpanel')) hideSelectionToolbar();
}

function clearSelection() {
  diffInstances.get(state.file + '|' + state.diffStyle)?.setSelectedLines(null);
  document.getSelection()?.removeAllRanges();
  hideSelectionToolbar();
}

function buildDiffElement(key, set, file, index) {
  const holder = document.createElement('div');
  if (file.binary) {
    holder.innerHTML = '<div class="diffnote">Binary file, no textual diff.</div>';
    return holder;
  }
  if (file.omitted) {
    holder.innerHTML = '<div class="diffnote">Generated file over 100 KB: patch omitted, stats kept (' + stats(file.adds, file.dels) + ').</div>';
    return holder;
  }
  if (!patchHasHunks(file)) {
    holder.innerHTML = '<div class="diffnote">' + (file.status === 'R' ? 'Renamed without content changes.' : 'No textual changes.') + '</div>';
    return holder;
  }
  const side = file.status === 'D' ? 'deletions' : 'additions';
  const lineAnnotations = set.findings.filter((finding) => finding.fileIndex === index && finding.line).map((finding) => ({ side, lineNumber: finding.line, metadata: finding }));
  try {
    const fileDiff = processPatch(file.patch).files[0];
    const instance = new FileDiff({
      theme: THEME,
      themeType: 'dark',
      overflow: 'wrap',
      diffStyle: state.diffStyle,
      diffIndicators: 'none',
      disableFileHeader: true,
      enableLineSelection: true,
      onLineSelected: (range) => onSelection(key, range),
      renderAnnotation: (annotation) => annotationElement(annotation.metadata),
    });
    instance.render({ containerWrapper: holder, fileDiff, lineAnnotations });
    diffInstances.set(key + '|' + state.diffStyle, instance);
  } catch (error) {
    holder.innerHTML = '<div class="diffnote">Diff could not be rendered: ' + esc(error.message) + '</div>';
  }
  return holder;
}

function cachedDiff(key, set, file, index) {
  const cacheKey = key + '|' + state.diffStyle;
  if (!diffCache.has(cacheKey)) diffCache.set(cacheKey, buildDiffElement(key, set, file, index));
  return diffCache.get(cacheKey);
}

function renderTabs() {
  const tab = (key, inner, title) =>
    '<div class="tab' + ((state.file ?? OVERVIEW) === key ? ' on' : '') + '" role="tab" tabindex="0" aria-selected="' + ((state.file ?? OVERVIEW) === key) + '" data-lavish-action="switch-tab" data-tab="' + esc(key) + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + inner + '</div>';
  let fileTab = '';
  if (state.file) {
    const { set, file } = lookup(state.file);
    const dir = dirName(file.path);
    fileTab = tab(
      state.file,
      '<span class="st s-' + file.status + '">' + file.status + '</span><span class="label">' + esc(baseName(file.path)) + '</span>' +
        (dir ? '<span class="desc">' + esc(dir) + '</span>' : '') + (multi ? '<span class="desc">' + esc(setName(set)) + '</span>' : '') +
        '<button type="button" class="tab-close" data-close title="Close" aria-label="Close ' + esc(baseName(file.path)) + '">' + icon('close') + '</button>',
      file.path,
    );
  }
  document.getElementById('tabs').innerHTML = tab(OVERVIEW, icon('book') + '<span class="label">Overview</span>') + fileTab;
}

function renderEditorActions() {
  const target = document.getElementById('editor-actions');
  if (!state.file) {
    target.innerHTML = '';
    return;
  }
  const viewed = state.viewed.has(state.file);
  target.innerHTML =
    '<button type="button" class="ibtn" data-toggle-viewed="' + state.file + '" aria-pressed="' + viewed + '" title="' + (viewed ? 'Viewed, click to unmark' : 'Mark as viewed') + '">' + icon(viewed ? 'eye-closed' : 'eye') + '</button>' +
    '<span class="seg" role="group" aria-label="Diff layout">' +
    ['unified', 'split']
      .map((style) => '<button type="button" class="ibtn" data-style="' + style + '" aria-pressed="' + (state.diffStyle === style) + '" title="' + (style === 'split' ? 'Side by side' : 'Inline') + '">' + icon(style === 'split' ? 'split-horizontal' : 'list-flat') + '</button>')
      .join('') +
    '</span>';
}

function renderFilebar() {
  const target = document.getElementById('filebar');
  if (!state.file) {
    target.innerHTML = '';
    return;
  }
  const { file } = lookup(state.file);
  target.innerHTML =
    file.flags.map((flag) => '<span class="flag tone-' + FLAG_META[flag].tone + '">' + icon('warning') + FLAG_META[flag].label + '</span>').join('') +
    (file.note ? '<span class="note">' + esc(file.note) + '</span>' : '') +
    '<span class="right"><span class="s-' + file.status + '">' + STATUS_LABEL[file.status] + '</span>' + (file.oldPath ? '<span>was ' + esc(file.oldPath) + '</span>' : '') +
    '<span>' + TIER_LABEL[file.tier] + '</span><span class="mono">' + stats(file.adds, file.dels) + '</span></span>';
}

function renderEditorBody() {
  const body = document.getElementById('editor-body');
  if (!state.file) {
    body.innerHTML = renderOverview();
    return;
  }
  const { set, file, index } = lookup(state.file);
  body.innerHTML = '<div class="diffwrap" id="diffmount"></div>';
  document.getElementById('diffmount').appendChild(cachedDiff(state.file, set, file, index));
  body.scrollTop = 0;
  hideSelectionToolbar();
}

function renderEditor() {
  renderTabs();
  renderEditorActions();
  renderFilebar();
  renderEditorBody();
}

function scrollToFinding(id) {
  requestAnimationFrame(() => {
    const target = document.querySelector('#diffmount [data-finding="' + CSS.escape(id) + '"]') ?? diffRoot()?.querySelector('[data-finding="' + CSS.escape(id) + '"]');
    target?.scrollIntoView({ block: 'center' });
  });
}

function renderStatus() {
  const { meta, usage } = DATA;
  const bySeverity = ['high', 'medium', 'low'].map((severity) => sevIcon(severity) + '<span>' + allFindings.filter((finding) => finding.severity === severity).length + '</span>').join('');
  const left =
    '<span class="sb remote">' + icon('source-control') + esc(meta.mode) + ' · ' + esc(meta.depth) + '</span>' +
    (meta.head ? '<span class="sb" title="' + esc(meta.base) + ' → ' + esc(meta.head) + '">' + icon('git-branch') + esc(meta.head) + (meta.baseSha || meta.headSha ? ' <span class="mono dim">' + esc(meta.baseSha) + ' → ' + esc(meta.headSha) + '</span>' : '') + '</span>' : '') +
    (allFindings.length ? '<button type="button" class="sb" data-tab="' + OVERVIEW + '" title="Findings by severity, in the Overview">' + bySeverity + '</button>' : '') +
    (state.file ? '<span class="sb hint">Select code to ask about it or request a change</span>' : '');
  const right =
    (DATA.sets.length ? '<span class="sb">' + icon('eye') + viewedCount(DATA.sets) + ' viewed</span>' : '') +
    (usage ? '<span class="sb" title="' + esc((usage.phases ?? []).map((phase) => phase.name + ' ' + fmtMs(phase.ms) + ' / ' + fmtTokens(phase.input + phase.output)).join(', ')) + '">' + fmtMs(usage.wallMs) + ' · in ' + fmtTokens(usage.total.input) + ' · out ' + fmtTokens(usage.total.output) + (usage.agents ? ' · ' + plural(usage.agents, 'agent') : '') + '</span>' : '') +
    '<span class="sb dim">Built ' + esc(new Date(meta.generatedAt).toLocaleString()) + '</span>';
  document.getElementById('statusbar').innerHTML = left + '<span class="sb-right">' + right + '</span>';
}

function renderAll() {
  renderChips();
  renderTree();
  renderEditor();
  renderStatus();
}

function showOverview() {
  if (!state.file) return;
  state.file = null;
  renderTree();
  renderEditor();
  renderStatus();
}

function openFile(key) {
  const { set } = parseKey(key);
  if (state.set !== 'all' && state.set !== set.id) {
    state.set = set.id;
    renderChips();
  }
  state.file = key;
  state.cursorKey = key;
  renderTree();
  renderEditor();
  renderStatus();
  document.querySelector('#tree .row.sel')?.scrollIntoView({ block: 'nearest' });
  const editor = document.querySelector('.editor');
  const top = editor.getBoundingClientRect().top;
  if (top < 0 || top > window.innerHeight * 0.6) editor.scrollIntoView({ block: 'start' });
}

function jumpTo(id) {
  showOverview();
  document.getElementById(id)?.scrollIntoView({ block: 'start' });
}

function selectSet(id) {
  state.set = id;
  renderChips();
  renderTree();
  if (!state.file) renderEditor();
}

function toggleCollapsed(id) {
  state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
  renderTree();
}

function toggleViewed(key, force) {
  const next = force ?? !state.viewed.has(key);
  next ? state.viewed.add(key) : state.viewed.delete(key);
  persistViewed();
  renderTree();
  renderEditorActions();
  renderStatus();
}

function moveCursor(delta) {
  const rows = [...document.querySelectorAll('#tree .file')];
  if (!rows.length) return;
  const current = rows.findIndex((row) => row.dataset.key === state.cursorKey);
  const next = Math.min(rows.length - 1, Math.max(0, current + delta));
  state.cursorKey = rows[next].dataset.key;
  renderTree();
  document.querySelector('#tree .row.cur')?.scrollIntoView({ block: 'nearest' });
}

function bindEvents() {
  document.addEventListener('click', (event) => {
    const target = event.target;
    const viewedBox = target.closest('[data-viewed]');
    if (viewedBox) return toggleViewed(viewedBox.dataset.viewed, viewedBox.checked);
    const viewedButton = target.closest('[data-toggle-viewed]');
    if (viewedButton) return toggleViewed(viewedButton.dataset.toggleViewed);
    const ask = target.closest('[data-ask]');
    if (ask) return openAskPanel(ask);
    if (target.closest('[data-ask-submit]')) return submitAskPanel(target.closest('[data-ask-submit]'));
    if (target.closest('[data-ask-cancel]')) return target.closest('.askpanel')?.remove();
    if (target.closest('[data-sel-clear]')) return clearSelection();
    if (target.closest('[data-close]')) return showOverview();
    const tab = target.closest('[data-tab]');
    if (tab) return tab.dataset.tab === OVERVIEW ? showOverview() : openFile(tab.dataset.tab);
    const jump = target.closest('[data-jump]');
    if (jump) return jumpTo(jump.dataset.jump);
    const set = target.closest('[data-set]');
    if (set) return selectSet(set.dataset.set);
    const open = target.closest('[data-open]');
    if (open) {
      openFile(open.dataset.open);
      if (open.dataset.findingId) scrollToFinding(open.dataset.findingId);
      return;
    }
    const style = target.closest('[data-style]');
    if (style) {
      state.diffStyle = style.dataset.style;
      renderEditorActions();
      return renderEditorBody();
    }
    const group = target.closest('[data-group]');
    if (group) return toggleCollapsed('g:' + state.set + ':' + group.dataset.group);
    const folder = target.closest('[data-folder]');
    if (folder) return toggleCollapsed(folder.dataset.folder);
    const row = target.closest('#tree .file');
    if (row) return openFile(row.dataset.key);
  });
  document.addEventListener('mouseup', (event) => setTimeout(() => updateSelectionToolbar(event), 0));
  document.addEventListener('keyup', (event) => {
    if (event.key.startsWith('Arrow') || event.key === 'Shift') setTimeout(() => updateSelectionToolbar(event), 0);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      const panel = document.querySelector('.askpanel');
      if (panel) panel.remove();
      else if (selectionToolbar) clearSelection();
      return;
    }
    const tab = event.target.closest?.('[data-tab]');
    if (tab && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      tab.dataset.tab === OVERVIEW ? showOverview() : openFile(tab.dataset.tab);
    }
  });
  document.getElementById('editor-body').addEventListener('scroll', positionToolbar, { passive: true });
  document.getElementById('tree').addEventListener('keydown', (event) => {
    if (event.key === 'ArrowDown') moveCursor(1);
    else if (event.key === 'ArrowUp') moveCursor(-1);
    else if ((event.key === 'Enter' || event.key === ' ') && state.cursorKey) openFile(state.cursorKey);
    else if (event.key === 'v' && state.cursorKey) toggleViewed(state.cursorKey);
    else return;
    event.preventDefault();
  });
}

renderShell();
renderAll();
bindEvents();
</script>
</body>
</html>
