<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review board</title>
<style>
:root {
  --bg: #1f1f1f;
  --side: #181818;
  --fg: #cccccc;
  --bright: #ffffff;
  --card: #202020;
  --dim: #9d9d9d;
  --accent: #0078d4;
  --link: #4daafc;
  --mauve: #37373d;
  --hover: #2a2d2e;
  --selected: #04395e;
  --line: #2b2b2b;
  --input: #313131;
  --input-line: #3c3c3c;
  --destructive: #f85149;
  --success: #81b88b;
  --warning: #e2c08d;
  --info: #4daafc;
  --renamed: #73c991;
  --r: 3px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe WPC', 'Segoe UI', system-ui, Ubuntu, 'Droid Sans', sans-serif;
  --mono: Menlo, Monaco, 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 13px/1.5 var(--font); overflow-x: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link); }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }

.topbar { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--side); }
.topline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; min-width: 0; }
.topline h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--bright); }
.topline .shas { font-family: var(--mono); font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.counter { margin-left: auto; font-size: 12px; border: 1px solid var(--warning); color: var(--warning); padding: 1px 8px; border-radius: var(--r); }
.lead { margin: 6px 0 10px; color: var(--dim); max-width: 110ch; }
.strip { display: grid; gap: 6px; }
.step { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; min-width: 0; display: grid; gap: 2px; }
.step:hover { border-color: var(--dim); }
.step.on { border-color: var(--accent); background: var(--selected); }
.step .t { display: flex; justify-content: space-between; gap: 6px; font-weight: 700; color: var(--bright); min-width: 0; }
.step .t > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .b { font-family: var(--mono); font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .s { font-size: 11px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 0 8px; }
.kind { font-size: 11px; font-weight: 500; white-space: nowrap; }
.k-merge { color: var(--success); } .k-worktree { color: var(--warning); } .k-fixes { color: var(--info); } .k-pr, .k-branch, .k-range, .k-commit { color: var(--dim); }
.warn { color: var(--warning); }
.add { color: var(--success); }
.del { color: var(--destructive); }

.panes { display: grid; grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
.left { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; background: var(--side); }
.left-head { padding: 10px 10px 6px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.setlist { display: grid; gap: 2px; }
.setsel { display: flex; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 1px solid transparent; border-radius: var(--r); padding: 3px 6px; min-width: 0; }
.setsel:hover { background: var(--hover); }
.setsel.on { background: var(--mauve); border-color: transparent; color: var(--bright); }
.setsel .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.setsel .c { color: var(--dim); font-size: 12px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: none; border: 1px solid var(--line); border-radius: var(--r); padding: 1px 8px; font-size: 12px; color: var(--dim); }
.chip[aria-pressed="true"] { background: var(--input); border-color: var(--accent); color: var(--bright); }
.tree { overflow: auto; flex: 1; min-height: 0; padding: 4px 0 24px; outline: none; font-size: 13px; }
.tree:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
.row { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 2px 8px 2px 0; cursor: pointer; border-left: 2px solid transparent; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--selected); border-left-color: var(--accent); color: var(--bright); }
.row.cur { outline: 1px solid var(--dim); outline-offset: -1px; }
.row .caret { width: 14px; text-align: center; color: var(--dim); flex: none; font-size: 10px; }
.row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .cnt { color: var(--dim); font-size: 11px; flex: none; }
.row .st { width: 14px; flex: none; text-align: center; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.row .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.row .num { flex: none; font-size: 11px; font-family: var(--mono); white-space: nowrap; }
.row .viewed { margin: 0 2px 0 0; flex: none; accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }
.row.isviewed .name { color: var(--dim); }
.row.isviewed .st, .row.isviewed .num { opacity: 0.6; }
.progress { font-size: 11px; color: var(--dim); white-space: nowrap; }
.t-core .name { font-weight: 700; color: var(--bright); }
.t-core .dot { background: var(--link); }
.t-supporting .dot { border: 1px solid var(--dim); }
.t-tests, .t-generated { opacity: 0.55; }
.t-tests .dot, .t-generated .dot { visibility: hidden; }
.s-A { color: var(--success); } .s-M { color: var(--warning); } .s-D { color: var(--destructive); } .s-R { color: var(--renamed); }
.setbadge, .fbadge { flex: none; font-size: 10px; font-family: var(--mono); border: 1px solid var(--line); padding: 0 4px; border-radius: var(--r); color: var(--dim); }
.fbadge { border-color: var(--warning); color: var(--warning); }
.empty-tree { padding: 16px; color: var(--dim); }

.right { padding: 14px 16px 24px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.right > *, .below > *, .stack > *, .diffwrap > * { min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; overflow-wrap: anywhere; }
.card h2 { margin: 0 0 6px; font-size: 16px; color: var(--bright); }
.card h3 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 500; }
.card p { margin: 0; }
.brief { display: grid; gap: 12px; }
.briefhead { display: grid; gap: 6px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip.t-core { opacity: 1; font-weight: 600; }
.chip.t-tests, .chip.t-generated { opacity: 1; }
.panelgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.panelgrid > * { min-width: 0; }
.bpanel { background: var(--side); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 6px; align-content: start; }
.bpanel.quiet { border-style: dashed; }
.bpanel header { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.bpanel h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 500; }
.bpanel h3 .dim { text-transform: none; letter-spacing: 0; font-weight: 400; }
.bpanel p { margin: 0; }
.items { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13px; }
.items.plain { list-style: none; padding-left: 0; }
.items li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; min-width: 0; }
.items li > .linkbtn { flex: 1 1 120px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: normal; }
.items li .num { font-size: 11px; font-family: var(--mono); color: var(--dim); margin-left: auto; white-space: nowrap; }
.items li .dim { flex: 1 1 100%; font-size: 12.5px; }
.flaggroup { display: grid; gap: 3px; }
.flaggroup .flaghead { display: flex; align-items: center; gap: 6px; }
.flaggroup .items { padding-left: 14px; }
.flag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 5px; border-radius: var(--r); border: 1px solid; margin-right: 4px; white-space: nowrap; }
.tone-destructive { color: var(--destructive); } .tone-warning { color: var(--warning); } .tone-info { color: var(--info); } .tone-success { color: var(--success); } .tone-dim { color: var(--dim); }
.jump { font-size: 12.5px; color: var(--link); }
details.desc, details.more { font-size: 13px; }
details.desc > summary, details.more > summary { cursor: pointer; color: var(--dim); display: flex; align-items: center; gap: 6px; }
details.desc > summary::marker, details.more > summary::marker { color: var(--dim); }
details.desc .md { margin-top: 8px; display: grid; gap: 6px; }
.summary { margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; }
.summary .md { flex: 1 1 auto; min-width: 0; display: grid; gap: 6px; }
.md p { margin: 0; }
.md .mdh { font-weight: 700; color: var(--bright); margin-top: 4px; }
.md ul, .md ol { margin: 0; padding-left: 20px; display: grid; gap: 2px; }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 0 4px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.stack .card { padding: 10px 12px; }
.commits { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
.startlist, .findlist { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.findlist { list-style: none; padding-left: 0; }
.linkbtn { background: none; border: 0; padding: 0; text-align: left; color: var(--link); font-family: var(--mono); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.linkbtn:hover { color: var(--bright); }
.sev { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 5px; border-radius: var(--r); border: 1px solid; margin-right: 6px; }
.sev-low { color: var(--info); } .sev-medium { color: var(--warning); } .sev-high { color: var(--destructive); }
.noref { font-family: var(--mono); font-size: 12.5px; color: var(--dim); }
.finding .body { display: block; margin-top: 2px; }

.ask { background: none; border: 1px solid var(--line); border-radius: var(--r); color: var(--dim); font-size: 11px; padding: 0 7px; margin-left: 6px; line-height: 18px; vertical-align: middle; flex: none; }
.ask:hover { border-color: var(--accent); color: var(--bright); }
.askpanel { margin: 6px 0; background: var(--bg); border: 1px solid var(--accent); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 6px; flex: 1 1 100%; width: 100%; min-width: 0; text-align: left; font: 400 14px/1.5 var(--font); }
.askpanel .actions { margin-top: 0; }
.askpanel textarea { width: 100%; background: var(--input); border: 1px solid var(--input-line); border-radius: var(--r); padding: 6px 8px; resize: vertical; }
.askref { font-size: 12px; }
.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; min-height: 24px; }
.seltool { position: absolute; z-index: 60; background: var(--card); border: 1px solid var(--accent); border-radius: var(--r); padding: 6px 8px; display: grid; gap: 6px; max-width: min(560px, calc(100vw - 16px)); min-width: 0; box-shadow: 0 6px 24px rgb(0 0 0 / 0.35); font-size: 12px; }
.seltool .selrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seltool .selrow .mono { font-size: 12px; margin-right: 4px; }
.seltool .ask { margin-left: 0; }
.seltool .askpanel { margin: 0; }
.annot { margin: 4px 8px; padding: 6px 10px; background: var(--card); border-left: 3px solid var(--warning); border-radius: var(--r); font: 400 13px/1.45 var(--font); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; }
.annot .body { flex: 1 1 100%; }

.diffhead { display: grid; gap: 6px; }
.diffhead .path { font-family: var(--mono); font-size: 13px; color: var(--bright); overflow-wrap: anywhere; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 12px; color: var(--dim); min-width: 0; }
.crumbs .sep { color: var(--dim); opacity: 0.7; }
.crumbs .leaf { color: var(--bright); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.badge { font-size: 11px; border: 1px solid var(--line); border-radius: var(--r); padding: 0 6px; color: var(--dim); }
.badge.core { color: var(--link); border-color: var(--link); }
.seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); }
.seg button { background: none; border: 0; padding: 2px 10px; font-size: 12px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--input); color: var(--bright); }
.diffwrap { border: 1px solid var(--line); border-radius: var(--r); min-width: 0; max-width: 100%; overflow: auto; background: var(--bg); }
.diffnote { padding: 18px; color: var(--dim); }
.emptystate { padding: 40px 16px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: var(--r); }

.below { padding: 0 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; max-width: 1200px; }
.below h2 { margin: 0 0 6px; font-size: 18px; color: var(--bright); }
.below section:empty { display: none; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--dim); font-weight: 500; font-size: 12px; }
tr:last-child td { border-bottom: 0; }
td.askcell { width: 1%; white-space: nowrap; }
.findtable th, .findtable td { white-space: nowrap; overflow-wrap: normal; }
.findtable td.ftext, .findtable th:nth-child(5) { white-space: normal; overflow-wrap: anywhere; min-width: 320px; width: 100%; }
.findtable .linkbtn { white-space: nowrap; }
.findtable select, .findtable input { background: var(--input); border: 1px solid var(--input-line); border-radius: var(--r); padding: 2px 6px; min-width: 120px; }
.res-pass { color: var(--success); font-weight: 500; }
.res-warn { color: var(--warning); }
.decisions { display: grid; gap: 10px; }
.dform { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 6px; min-width: 0; }
.dform .q { font-weight: 500; color: var(--bright); overflow-wrap: anywhere; }
.dform label.opt { display: flex; gap: 8px; align-items: flex-start; }
.dform textarea { width: 100%; min-height: 44px; background: var(--input); border: 1px solid var(--input-line); border-radius: var(--r); padding: 6px 8px; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.btn { background: var(--accent); color: #ffffff; border: 0; border-radius: var(--r); padding: 4px 12px; font-weight: 500; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: none; color: var(--fg); border: 1px solid var(--input-line); }
.pill { font-size: 11px; border: 1px solid var(--line); border-radius: var(--r); padding: 0 6px; color: var(--dim); }
.pill.queued { color: var(--success); border-color: var(--success); }
.pill.sel { color: var(--link); border-color: var(--link); }
.inline-answer { font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; }
.copyrow { display: grid; gap: 6px; margin-top: 12px; }
.copyrow textarea { width: 100%; background: var(--input); border: 1px solid var(--input-line); color: var(--fg); }
footer.usage { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--fg); border-top: 1px solid var(--line); padding-top: 10px; }

@media (max-width: 900px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .panes { grid-template-columns: minmax(0, 1fr); }
  .left { position: static; height: 60vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .counter { margin-left: 0; }
}
</style>
</head>
<body>
<div id="app"></div>
<script id="review-data" type="application/json">{"meta":{"title":"Review board","lead":"","mode":"branch","depth":"light","base":"","head":"","baseSha":"","headSha":"","generatedAt":"1970-01-01T00:00:00.000Z","slug":"skeleton"},"sets":[],"verification":null,"decisions":[],"usage":null}</script>
<script type="module">
import { FileDiff, processPatch } from 'https://esm.sh/@pierre/diffs@1.2.10?bundle';

const DATA = JSON.parse(document.getElementById('review-data').textContent);
const THEME = { light: 'light-plus', dark: 'dark-plus' };
const TIER_GROUPS = [
  { id: 'core', label: 'Core', tiers: ['core'] },
  { id: 'supporting', label: 'Supporting', tiers: ['supporting'] },
  { id: 'tests', label: 'Tests & generated', tiers: ['tests', 'generated'] },
];
const TIER_LABEL = { core: 'Core', supporting: 'Supporting', tests: 'Tests', generated: 'Generated' };
const STATUS_LABEL = { A: 'Added', M: 'Modified', D: 'Deleted', R: 'Renamed' };
const KIND_LABEL = { merge: '✓ merged', pr: 'pull request', branch: 'branch', range: 'range', worktree: '● working tree', fixes: '✚ fixes', commit: 'commit' };
const DISPOSITIONS = [
  ['fix', 'Fix now'],
  ['accept', 'Accept as is'],
  ['defer', 'Defer, open issue'],
];

const state = {
  set: DATA.sets.length > 1 ? 'all' : DATA.sets[0]?.id ?? 'all',
  fileKey: null,
  cursorKey: null,
  tiers: new Set(TIER_GROUPS.map((group) => group.id)),
  collapsed: new Set(),
  diffStyle: window.innerWidth >= 1200 ? 'split' : 'unified',
  viewed: new Set(),
};
const VIEWED_KEY = 'review-board:' + (DATA.meta.slug ?? DATA.meta.title) + ':viewed';
try {
  for (const key of JSON.parse(localStorage.getItem(VIEWED_KEY) ?? '[]')) state.viewed.add(key);
} catch {}
const persistViewed = () => {
  try {
    localStorage.setItem(VIEWED_KEY, JSON.stringify([...state.viewed]));
  } catch {}
};
const diffCache = new Map();
const diffInstances = new Map();
const setById = new Map(DATA.sets.map((set) => [set.id, set]));
const multi = DATA.sets.length > 1;
const allFindings = DATA.sets.flatMap((set) => set.findings.map((finding) => ({ ...finding, set })));

const esc = (value) =>
  String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
const baseName = (path) => path.split('/').pop();
const GENERIC_NAMES = /^(index|route|page|layout|migration|service|types|constants)\.[a-z]+$/;
const displayName = (path) => {
  const parts = path.split('/');
  const base = parts.pop();
  return GENERIC_NAMES.test(base) && parts.length ? parts.pop() + '/' + base : base;
};
const fileKey = (setId, index) => setId + '|' + index;
const parseKey = (key) => {
  const [setId, index] = key.split('|');
  return { set: setById.get(setId), index: Number(index) };
};
const lookup = (key) => {
  const { set, index } = parseKey(key);
  return { set, index, file: set.files[index] };
};
const stats = (adds, dels) => '<span class="add">+' + adds + '</span> <span class="del">−' + dels + '</span>';
const tierGroupOf = (tier) => TIER_GROUPS.find((group) => group.tiers.includes(tier)).id;
const fmtTokens = (n) => (n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(0) + 'k' : String(n));
const fmtMs = (ms) => {
  const s = Math.round(ms / 1000);
  return s >= 3600 ? Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm' : s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's';
};

const inlineMarkdown = (text) =>
  esc(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

function renderMarkdown(text) {
  const blocks = [];
  let list = null;
  const closeList = () => {
    if (list) blocks.push('<' + list.tag + '>' + list.items.join('') + '</' + list.tag + '>');
    list = null;
  };
  const pushItem = (tag, item) => {
    if (!list || list.tag !== tag) {
      closeList();
      list = { tag, items: [] };
    }
    list.items.push('<li>' + inlineMarkdown(item) + '</li>');
  };
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    const heading = /^(#{1,6})\s+(.*)$/.exec(line);
    const bullet = /^\s*[-*]\s+(.*)$/.exec(line);
    const numbered = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (heading) {
      closeList();
      blocks.push('<p class="mdh">' + inlineMarkdown(heading[2]) + '</p>');
    } else if (bullet) pushItem('ul', bullet[1]);
    else if (numbered) pushItem('ol', numbered[1]);
    else if (!line.trim()) closeList();
    else {
      closeList();
      blocks.push('<p>' + inlineMarkdown(line) + '</p>');
    }
  }
  closeList();
  return blocks.join('');
}

const totals = DATA.sets.reduce(
  (sum, set) => ({ files: sum.files + set.files.length, adds: sum.adds + set.adds, dels: sum.dels + set.dels }),
  { files: 0, adds: 0, dels: 0 },
);

const askAttr = (ctx) => ' data-ask="' + esc(JSON.stringify(ctx)) + '"';
const askButton = (ctx, label = 'Ask') =>
  '<button type="button" class="ask"' + askAttr(ctx) + ' title="Queue a question about this for the agent">' + label + '</button>';

function askPrompt(ctx, text) {
  const where = [
    ctx.set ? 'change set ' + ctx.set : null,
    ctx.file ? ctx.file + (ctx.line ? ':' + ctx.line : ctx.start ? ':' + ctx.start + '-' + ctx.end : '') : null,
    ctx.finding ? 'finding ' + ctx.finding : null,
  ]
    .filter(Boolean)
    .join(', ');
  const kind = ctx.tag === 'change-request' ? 'Change request' : 'Question';
  let prompt = kind + ' about ' + ctx.what + (where ? ' (' + where + ')' : '') + ': ' + text;
  if (ctx.quote) prompt += '\n\nQuoted: ' + ctx.quote;
  if (ctx.code) prompt += '\n\nSelected code (' + ctx.side + ' side, lines ' + ctx.start + '-' + ctx.end + '):\n```\n' + ctx.code + '\n```';
  return prompt;
}

function queueAsk(ctx, text, form) {
  const prompt = askPrompt(ctx, text);
  const label = (ctx.tag === 'change-request' ? 'Change: ' : 'Q: ') + (ctx.ref ?? ctx.what);
  if (window.lavish) {
    window.lavish.queuePrompt(prompt, { tag: ctx.tag ?? 'question', text: label, element: form, data: { ...ctx, question: text } });
    form.innerHTML = '<span class="pill queued">queued</span>';
    setTimeout(() => form.remove(), 1500);
    return;
  }
  form.innerHTML = '<div class="inline-answer">' + esc(prompt) + '</div><button type="button" class="btn ghost" data-ask-cancel>Close</button>';
}

function openAskPanel(button) {
  document.querySelector('.askpanel')?.remove();
  const ctx = JSON.parse(button.dataset.ask);
  const panel = document.createElement('div');
  panel.className = 'askpanel';
  panel.dataset.ctx = button.dataset.ask;
  const placeholder = ctx.tag === 'change-request' ? 'What should change here?' : 'What do you want to know about this?';
  panel.innerHTML =
    '<div class="askref mono dim">' + esc(ctx.ref ?? ctx.what) + '</div>' +
    '<textarea name="text" rows="3" placeholder="' + esc(placeholder) + '"></textarea>' +
    '<div class="actions"><button type="button" class="btn" data-ask-submit>' + (ctx.tag === 'change-request' ? 'Queue change request' : 'Queue question') + '</button>' +
    '<button type="button" class="btn ghost" data-ask-cancel>Cancel</button></div>';
  const host = button.closest('[data-askhost]') ?? button.parentElement;
  host.appendChild(panel);
  panel.querySelector('textarea').focus();
}

function submitAskPanel(button) {
  const panel = button.closest('.askpanel');
  const text = panel.querySelector('textarea').value.trim();
  if (!text) {
    panel.querySelector('textarea').focus();
    return;
  }
  queueAsk(JSON.parse(panel.dataset.ctx), text, panel);
}

const newDir = (name) => ({ name, dirs: new Map(), files: [] });

function buildTree(entries) {
  const root = newDir('');
  for (const entry of entries) {
    const parts = entry.file.path.split('/');
    let node = root;
    for (const dir of parts.slice(0, -1)) {
      if (!node.dirs.has(dir)) node.dirs.set(dir, newDir(dir));
      node = node.dirs.get(dir);
    }
    node.files.push(entry);
  }
  return root;
}

const countFiles = (node) => node.files.length + [...node.dirs.values()].reduce((sum, dir) => sum + countFiles(dir), 0);

function compact(node, parentPath) {
  let current = node;
  let label = node.name;
  while (current.files.length === 0 && current.dirs.size === 1) {
    current = [...current.dirs.values()][0];
    label += '/' + current.name;
  }
  return { node: current, label, path: parentPath ? parentPath + '/' + label : label };
}

function fileRow(entry, depth, showSet) {
  const { file, key, set } = entry;
  const classes = ['row', 'file', 't-' + file.tier];
  if (state.viewed.has(key)) classes.push('isviewed');
  if (state.fileKey === key) classes.push('sel');
  if (state.cursorKey === key) classes.push('cur');
  const title = file.oldPath ? file.oldPath + ' → ' + file.path : file.path;
  const findings = set.findings.filter((finding) => finding.fileIndex === set.files.indexOf(file)).length;
  return (
    '<div class="' + classes.join(' ') + '" role="treeitem" data-lavish-action="open-file" data-key="' + key + '" style="padding-left:' + (depth * 12 + 6) + 'px" title="' + esc(title) + '">' +
    '<input type="checkbox" class="viewed" data-viewed="' + key + '" title="Mark as viewed"' + (state.viewed.has(key) ? ' checked' : '') + '>' +
    '<span class="dot"></span><span class="st s-' + file.status + '">' + file.status + '</span>' +
    '<span class="name">' + esc(baseName(file.path)) + '</span>' +
    (findings ? '<span class="fbadge" title="' + findings + ' findings">' + findings + '</span>' : '') +
    (showSet ? '<span class="setbadge">' + esc(set.pr ? '#' + set.pr : set.id) + '</span>' : '') +
    '<span class="num">' + stats(file.adds, file.dels) + '</span></div>'
  );
}

function folderRows(node, depth, parentPath, showSet) {
  const dirs = [...node.dirs.values()].sort((a, b) => a.name.localeCompare(b.name)).map((dir) => compact(dir, parentPath));
  const html = [];
  for (const dir of dirs) {
    const id = state.set + ':' + dir.path;
    const collapsed = state.collapsed.has(id);
    html.push(
      '<div class="row folder" role="treeitem" data-lavish-action="toggle-folder" aria-expanded="' + !collapsed + '" data-folder="' + esc(id) + '" style="padding-left:' + (depth * 12 + 6) + 'px" title="' + esc(dir.path) + '">' +
      '<span class="caret">' + (collapsed ? '▶' : '▼') + '</span><span class="name">' + esc(dir.label) + '</span>' +
      '<span class="cnt">' + countFiles(dir.node) + '</span></div>',
    );
    if (!collapsed) html.push(folderRows(dir.node, depth + 1, dir.path, showSet));
  }
  const files = [...node.files].sort((a, b) => baseName(a.file.path).localeCompare(baseName(b.file.path)));
  for (const entry of files) html.push(fileRow(entry, depth, showSet));
  return html.join('');
}

function renderTree() {

const FLAG_META = {
  schema: { label: 'Schema & migrations', tone: 'destructive', weight: 5 },
  auth: { label: 'Auth, tokens & secrets', tone: 'destructive', weight: 5 },
  api: { label: 'API surface', tone: 'warning', weight: 4 },
  infra: { label: 'Infrastructure', tone: 'warning', weight: 3 },
  config: { label: 'Config & env', tone: 'warning', weight: 2 },
  deleted: { label: 'Deleted', tone: 'destructive', weight: 1 },
  agent: { label: 'Agent config', tone: 'info', weight: 1 },
  large: { label: 'Large change', tone: 'dim', weight: 0 },
};
const FLAG_ORDER = Object.keys(FLAG_META);
const SEVERITY_ORDER = { high: 0, medium: 1, low: 2 };
const reviewable = (file) => file.tier === 'core' || file.tier === 'supporting';

function readFirst(set, limit) {
  if (set.startHere.length) return { auto: false, indices: set.startHere.slice(0, limit) };
  const scored = set.files
    .map((file, index) => ({ index, score: file.flags.reduce((sum, flag) => sum + FLAG_META[flag].weight, 0) + Math.min((file.adds + file.dels) / 100, 3) }))
    .filter(({ index }) => reviewable(set.files[index]))
    .sort((a, b) => b.score - a.score);
  return { auto: true, indices: scored.slice(0, limit).map((entry) => entry.index) };
}

function flagGroups(set) {
  return FLAG_ORDER.map((flag) => ({ flag, indices: set.files.map((file, index) => (file.flags.includes(flag) ? index : -1)).filter((index) => index >= 0) })).filter((group) => group.indices.length);
}

const tierCounts = (set) => set.files.reduce((counts, file) => ({ ...counts, [file.tier]: (counts[file.tier] ?? 0) + 1 }), {});

function panel(title, body, ctx, extraClass = '') {
  return (
    '<section class="bpanel ' + extraClass + '" data-askhost><header><h3>' + title + '</h3>' + askButton(ctx) + '</header>' + body + '</section>'
  );
}

function fileList(set, indices, limit, withNotes) {
  const shown = indices.slice(0, limit);
  const rest = indices.slice(limit);
  const item = (index) => {
    const file = set.files[index];
    return '<li>' + fileButton(set, index) + (withNotes && file.note ? '<span class="dim"> - ' + esc(file.note) + '</span>' : '') + '<span class="num">' + stats(file.adds, file.dels) + '</span></li>';
  };
  return (
    '<ol class="items">' + shown.map(item).join('') + '</ol>' +
    (rest.length ? '<details class="more"><summary>' + rest.length + ' more</summary><ol class="items" start="' + (limit + 1) + '">' + rest.map(item).join('') + '</ol></details>' : '')
  );
}

function readFirstPanel(set, compact) {
  const { auto, indices } = readFirst(set, compact ? 3 : 6);
  if (!indices.length) return '';
  const title = auto ? 'Read first <span class="dim">suggested by risk and churn</span>' : 'Read first';
  const quote = indices.map((index) => set.files[index].path).join(', ');
  return panel(title, fileList(set, indices, compact ? 3 : 6, !auto), { what: 'read first list', ref: set.label, set: set.id, quote });
}

function checkPanel(set, compact) {
  const groups = flagGroups(set);
  if (!groups.length) return '';
  const body = groups
    .slice(0, compact ? 2 : groups.length)
    .map((group) => {
      const meta = FLAG_META[group.flag];
      return (
        '<div class="flaggroup"><div class="flaghead"><span class="flag tone-' + meta.tone + '">' + meta.label + '</span><span class="dim">' + group.indices.length + ' files</span></div>' +
        fileList(set, group.indices, compact ? 2 : 4, false) + '</div>'
      );
    })
    .join('');
  const quote = groups.map((group) => FLAG_META[group.flag].label + ': ' + group.indices.length).join('; ');
  return panel('Check carefully', body, { what: 'check carefully list', ref: set.label, set: set.id, quote });
}

function findingsPanel(set, compact) {
  const sorted = [...set.findings].sort((a, b) => (SEVERITY_ORDER[a.severity] ?? 3) - (SEVERITY_ORDER[b.severity] ?? 3));
  if (!sorted.length) {
    const note = DATA.meta.depth === 'light' ? 'Light board: code review was not run.' : 'Code review found nothing to report.';
    return panel('Findings', '<p class="dim">' + note + '</p>', { what: 'findings', ref: set.label, set: set.id, quote: note }, 'quiet');
  }
  const counts = ['high', 'medium', 'low'].filter((sev) => sorted.some((finding) => finding.severity === sev)).map((sev) => '<span class="sev sev-' + sev + '">' + sorted.filter((finding) => finding.severity === sev).length + ' ' + sev + '</span>').join('');
  const items = sorted
    .slice(0, compact ? 2 : 5)
    .map(
      (finding) =>
        '<li class="finding" data-askhost><span class="sev sev-' + finding.severity + '">' + finding.severity + '</span>' + findingLink(set, finding) +
        askButton(findingCtx(set, finding)) + '<span class="body">' + esc(finding.text.length > 140 ? finding.text.slice(0, 140).trimEnd() + '…' : finding.text) + '</span></li>',
    )
    .join('');
  const body = '<div class="chiprow">' + counts + '</div><ul class="findlist">' + items + '</ul>' + '<a class="jump" href="#findings">Disposition for all ' + sorted.length + ' findings ↓</a>';
  return panel('Findings', body, { what: 'findings', ref: set.label, set: set.id, quote: sorted.map((finding) => finding.id + ' ' + finding.severity).join(', ') });
}

function humanPanel(set, compact) {
  const items = [];
  if (DATA.decisions.length) items.push('<li><a class="jump" href="#decisions">' + DATA.decisions.length + ' decision' + (DATA.decisions.length > 1 ? 's' : '') + ' waiting for you ↓</a></li>');
  const failing = (DATA.verification?.rows ?? []).filter((row) => row.result !== 'pass');
  if (failing.length) items.push('<li><span class="flag tone-warning">Checks</span> ' + failing.map((row) => esc(row.check) + ': ' + esc(row.result)).join('<br>') + '</li>');
  else if (DATA.verification?.rows?.length) items.push('<li><span class="flag tone-success">Checks</span> all ' + DATA.verification.rows.length + ' pass</li>');
  else items.push('<li><span class="flag tone-dim">Checks</span> not run on this board</li>');
  const protectedGroups = flagGroups(set).filter((group) => ['schema', 'auth', 'infra', 'config', 'agent'].includes(group.flag));
  if (protectedGroups.length) items.push('<li><span class="flag tone-destructive">Protected areas</span> ' + protectedGroups.map((group) => FLAG_META[group.flag].label.toLowerCase() + ' (' + group.indices.length + ')').join(', ') + '</li>');
  const deleted = set.files.filter((file) => file.status === 'D').length;
  if (deleted) items.push('<li><span class="flag tone-destructive">Deleted</span> ' + deleted + ' file' + (deleted > 1 ? 's' : '') + ' removed</li>');
  if (set.kind === 'worktree') items.push('<li><span class="flag tone-warning">Uncommitted</span> this set is the working tree, nothing here is in a commit yet</li>');
  if (DATA.meta.depth === 'light') items.push('<li class="dim">Light board: no code review or verification. Rerun with --full for both.</li>');
  const quote = items.map((item) => item.replace(/<[^>]+>/g, '')).join('; ');
  return panel('Needs a human', '<ul class="items plain">' + items.slice(0, compact ? 3 : items.length).join('') + '</ul>', { what: 'needs a human list', ref: set.label, set: set.id, quote });
}

const patchHasHunks = (file) => file.patch.includes('\n@@ ');

function excerpt(patch, side, start, end) {
  const out = [];
  let oldN = 0;
  let newN = 0;
  let inHunk = false;
  for (const line of patch.split('\n')) {
    const hunk = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
    if (hunk) {
      oldN = Number(hunk[1]);
      newN = Number(hunk[2]);
      inHunk = true;
      continue;
    }
    if (!inHunk || line.startsWith('\\')) continue;
    const tag = line[0];
    const text = line.slice(1);
    if (tag === '+') {
      if (side === 'additions' && newN >= start && newN <= end) out.push(text);
      newN++;
    } else if (tag === '-') {
      if (side === 'deletions' && oldN >= start && oldN <= end) out.push(text);
      oldN++;
    } else {
      const n = side === 'additions' ? newN : oldN;
      if (n >= start && n <= end) out.push(text);
      oldN++;
      newN++;
    }
  }
  return out.join('\n');
}

}

const diffRoot = () => document.querySelector('#diffmount diffs-container')?.shadowRoot ?? null;
const contentLines = (root) => [...root.querySelectorAll('[data-content] [data-line]')];
function lineElementOf(container, offset, isEnd) {
  const direct = (container.nodeType === 1 ? container : container.parentElement)?.closest('[data-line]');
  if (direct) return direct;
  if (container.nodeType !== 1) return null;
  const child = container.childNodes[isEnd ? Math.max(0, offset - 1) : Math.min(offset, container.childNodes.length - 1)];
  if (!child) return null;
  if (child.nodeType === 1 && child.matches('[data-line]')) return child;
  return child.nodeType === 1 ? (child.querySelector('[data-line]') ?? child.closest('[data-line]')) : null;
}

function rangeFromLines(root, lines, startEl, endEl) {
  const startIndex = lines.indexOf(startEl);
  const endIndex = lines.indexOf(endEl);
  if (startIndex < 0 || endIndex < 0) return null;
  const [from, to] = startIndex <= endIndex ? [startIndex, endIndex] : [endIndex, startIndex];
  const span = lines.slice(from, to + 1);
  const allDeleted = span.every((el) => el.dataset.lineType === 'change-deletion');
  const side = allDeleted ? 'deletions' : 'additions';
  const otherSide = side === 'additions' ? 'change-deletion' : 'change-addition';
  const numberOf = (el) => (el.dataset.lineType === otherSide ? (el.dataset.altLine ? Number(el.dataset.altLine) : null) : Number(el.dataset.line));
  const numbers = span.map(numberOf).filter((n) => Number.isFinite(n));
  if (!numbers.length) return null;
  return { side, start: Math.min(...numbers), end: Math.max(...numbers), anchor: lines[to] };
}

function selectionInDiff() {
  const root = diffRoot();
  if (!root || !state.fileKey) return null;
  const shadowSelection = root.getSelection?.();
  let range = null;
  let text = '';
  if (shadowSelection && shadowSelection.rangeCount && !shadowSelection.isCollapsed) {
    range = shadowSelection.getRangeAt(0);
    text = shadowSelection.toString();
  } else {
    const selection = document.getSelection();
    if (!selection || selection.isCollapsed) return null;
    range = selection.getComposedRanges?.({ shadowRoots: [root] })[0] ?? null;
    text = selection.toString();
  }
  if (!range || !text.trim()) return null;
  const startEl = lineElementOf(range.startContainer, range.startOffset, false);
  const endEl = lineElementOf(range.endContainer, range.endOffset, true);
  if (!startEl || !endEl || !root.contains(startEl) || !root.contains(endEl)) return null;
  const lines = rangeFromLines(root, contentLines(root), startEl, endEl);
  if (!lines) return null;
  return { ...lines, code: text.replace(/\n{3,}/g, '\n\n').trimEnd() };
}

let selectionToolbar = null;

function hideSelectionToolbar() {
  selectionToolbar?.remove();
  selectionToolbar = null;
}

function showSelectionToolbar(selection) {
  const { set, file } = lookup(state.fileKey);
  const ref = displayName(file.path) + ':' + selection.start + (selection.end !== selection.start ? '-' + selection.end : '');
  const ctx = { what: 'selected code', ref, set: set.id, file: file.path, side: selection.side, start: selection.start, end: selection.end, code: selection.code };
  hideSelectionToolbar();
  selectionToolbar = document.createElement('div');
  selectionToolbar.className = 'seltool';
  selectionToolbar.dataset.askhost = '';
  selectionToolbar.innerHTML =
    '<div class="selrow"><span class="mono">' + esc(ref) + ' <span class="dim">' + (selection.side === 'additions' ? 'new' : 'old') + '</span></span>' +
    askButton({ ...ctx, tag: 'question' }, 'Ask about this') + askButton({ ...ctx, tag: 'change-request' }, 'Request change') +
    '<button type="button" class="ask" data-sel-clear title="Dismiss">×</button></div>';
  document.body.appendChild(selectionToolbar);
  const rect = selection.anchor.getBoundingClientRect();
  const width = selectionToolbar.offsetWidth;
  selectionToolbar.style.top = rect.bottom + window.scrollY + 6 + 'px';
  selectionToolbar.style.left = Math.max(8, Math.min(rect.left + window.scrollX, window.scrollX + window.innerWidth - width - 8)) + 'px';
}

function onSelection(key, range) {
  if (state.fileKey !== key) return;
  if (!range) {
    if (!selectionToolbar?.querySelector('.askpanel')) hideSelectionToolbar();
    return;
  }
  const { file } = lookup(key);
  const start = Math.min(range.start, range.end);
  const end = Math.max(range.start, range.end);
  const side = range.side ?? (file.status === 'D' ? 'deletions' : 'additions');
  const root = diffRoot();
  const anchor = root ? contentLines(root).find((el) => Number(el.dataset.line) === end && (side === 'deletions') === (el.dataset.lineType === 'change-deletion')) ?? contentLines(root).find((el) => Number(el.dataset.line) === end) : null;
  if (!anchor) return;
  showSelectionToolbar({ side, start, end, anchor, code: excerpt(file.patch, side, start, end) });
}

function updateSelectionToolbar(event) {
  if (selectionToolbar && event.composedPath().includes(selectionToolbar)) return;
  const selection = selectionInDiff();
  if (selection) showSelectionToolbar(selection);
  else if (!selectionToolbar?.querySelector('.askpanel')) hideSelectionToolbar();
}

function clearSelection() {
  diffInstances.get(state.fileKey + '|' + state.diffStyle)?.setSelectedLines(null);
  document.getSelection()?.removeAllRanges();
  hideSelectionToolbar();
}

function buildDiffElement(key, set, file, index) {
  const holder = document.createElement('div');
  if (file.binary) {
    holder.innerHTML = '<div class="diffnote">Binary file, no textual diff.</div>';
    return holder;
  }
  if (file.omitted) {
    holder.innerHTML = '<div class="diffnote">Generated file over 100 KB: patch omitted, stats kept (' + stats(file.adds, file.dels) + ').</div>';
    return holder;
  }
  if (!patchHasHunks(file)) {
    holder.innerHTML = '<div class="diffnote">' + (file.status === 'R' ? 'Renamed without content changes.' : 'No textual changes.') + '</div>';
    return holder;
  }
  const side = file.status === 'D' ? 'deletions' : 'additions';
  const lineAnnotations = set.findings.filter((finding) => finding.fileIndex === index && finding.line).map((finding) => ({ side, lineNumber: finding.line, metadata: finding }));
  try {
    const fileDiff = processPatch(file.patch).files[0];
    const instance = new FileDiff({
      theme: THEME,
      themeType: 'dark',
      overflow: 'wrap',
      diffStyle: state.diffStyle,
      enableLineSelection: true,
      onLineSelected: (range) => onSelection(key, range),
      renderAnnotation: (annotation) => annotationElement(annotation.metadata, set),
    });
    instance.render({ containerWrapper: holder, fileDiff, lineAnnotations });
    diffInstances.set(key + '|' + state.diffStyle, instance);
  } catch (error) {
    holder.innerHTML = '<div class="diffnote">Diff could not be rendered: ' + esc(error.message) + '</div>';
  }
  return holder;
}

function cachedDiff(key, set, file, index) {
  const cacheKey = key + '|' + state.diffStyle;
  if (!diffCache.has(cacheKey)) diffCache.set(cacheKey, buildDiffElement(key, set, file, index));
  return diffCache.get(cacheKey);
}

function renderSelectionBar() {
  const bar = document.getElementById('selbar');
  if (bar) bar.innerHTML = '<span class="dim">Select code, or click line numbers, to ask about it or request a change.</span>';
}

function renderDiffPane() {
  const pane = document.getElementById('diffpane');
  if (!state.fileKey) {
    pane.innerHTML = '<div class="emptystate">Pick a file in the tree' + (DATA.sets.some((set) => set.startHere.length) ? ', or start with the first file under Start here' : '') + '</div>';
    return;
  }
  const { set, file, index } = lookup(state.fileKey);
  const path = file.oldPath ? file.oldPath + ' → ' + file.path : file.path;
  const crumbs = file.path.split('/');
  const leaf = crumbs.pop();
  const viewed = state.viewed.has(state.fileKey);
  pane.innerHTML =
    '<div class="diffhead card" data-askhost><div class="crumbs" title="' + esc(path) + '">' + crumbs.map((part) => '<span>' + esc(part) + '</span><span class="sep">›</span>').join('') + '<span class="leaf">' + esc(leaf) + '</span>' +
    (file.oldPath ? '<span class="dim">(was ' + esc(file.oldPath) + ')</span>' : '') + '</div>' +
    '<div class="meta"><span class="badge s-' + file.status + '">' + STATUS_LABEL[file.status] + '</span>' +
    '<span class="badge ' + (file.tier === 'core' ? 'core' : '') + '">' + TIER_LABEL[file.tier] + '</span>' +
    (multi ? '<span class="badge">' + esc(set.pr ? 'PR #' + set.pr : set.label) + '</span>' : '') +
    '<span>' + stats(file.adds, file.dels) + '</span>' +
    askButton({ what: 'file', ref: displayName(file.path), set: set.id, file: file.path, quote: file.note ?? undefined }) +
    '<button type="button" class="ask" data-toggle-viewed="' + state.fileKey + '">' + (viewed ? 'Viewed ✓' : 'Mark viewed') + '</button>' +
    '<span class="seg" role="group" aria-label="Diff layout">' +
    ['unified', 'split'].map((style) => '<button type="button" data-style="' + style + '" aria-pressed="' + (state.diffStyle === style) + '">' + style + '</button>').join('') +
    '</span></div>' +
    (file.note ? '<div class="dim">' + esc(file.note) + '</div>' : '') +
    '</div><div class="selbar" id="selbar"></div><div class="diffwrap" id="diffmount"></div>';
  document.getElementById('diffmount').appendChild(cachedDiff(state.fileKey, set, file, index));
  renderSelectionBar();
  hideSelectionToolbar();
}

function renderFindings() {
  const target = document.getElementById('findings');
  if (!allFindings.length) {
    target.innerHTML = '';
    return;
  }
  target.innerHTML =
    '<h2>Findings</h2><p class="dim">Give every finding a disposition, then queue the batch once. The agent must account for every ID.</p>' +
    '<form id="findings-form" data-lavish-question="findings"><div class="tablewrap"><table class="findtable"><thead><tr><th>ID</th><th>Sev</th>' + (multi ? '<th>Set</th>' : '') + '<th>Where</th><th>Finding</th><th>Disposition</th><th>Note</th></tr></thead><tbody>' +
    allFindings
      .map(
        (finding) =>
          '<tr data-finding="' + esc(finding.id) + '"><td class="mono">' + esc(finding.id) + '</td><td><span class="sev sev-' + finding.severity + '">' + finding.severity + '</span></td>' +
          (multi ? '<td>' + esc(finding.set.pr ? '#' + finding.set.pr : finding.set.label) + '</td>' : '') +
          '<td>' + findingLink(finding.set, finding) + '</td>' +
          '<td class="ftext" data-askhost>' + esc(finding.text) + ' ' + askButton(findingCtx(finding.set, finding)) + '</td>' +
          '<td><select name="disp:' + esc(finding.id) + '"><option value="">choose…</option>' + DISPOSITIONS.map(([value, label]) => '<option value="' + value + '">' + label + '</option>').join('') + '</select></td>' +
          '<td><input name="note:' + esc(finding.id) + '" placeholder="optional"></td></tr>',
      )
      .join('') +
    '</tbody></table></div>' +
    '<div class="actions"><button type="submit" class="btn">Queue findings batch</button><span class="pill" data-status>no batch queued</span></div>' +
    '<div class="inline-answer" data-inline hidden></div></form>';
}

function setStatus(form, text, kind) {
  const pill = form.querySelector('[data-status]');
  pill.textContent = text;
  pill.className = 'pill ' + kind;
}

function onFindingsSubmit(form) {
  const data = new FormData(form);
  const items = allFindings.map((finding) => ({
    id: finding.id,
    label: findingRef(finding) + ' ' + finding.text.slice(0, 80),
    disposition: data.get('disp:' + finding.id) || null,
    note: String(data.get('note:' + finding.id) || '').trim(),
    file: finding.file,
    line: finding.line ?? null,
    set: finding.set.id,
  }));
  const missing = items.filter((item) => !item.disposition).map((item) => item.id);
  if (missing.length) {
    setStatus(form, 'no disposition yet: ' + missing.join(', '), 'sel');
    return;
  }
  const prompt =
    'Act on every finding in data.items and return an item-by-item receipt. fix: one commit per finding on the reviewed branch with its proving test rerun; accept: list as accepted; defer: open a GitHub issue carrying file, line, finding text and the PR link, then link it. Account for every submitted ID before reporting completion.\n\n' +
    items.map((item) => item.id + ' → ' + item.disposition + (item.note ? ' (' + item.note + ')' : '')).join('\n');
  const inline = form.querySelector('[data-inline]');
  if (window.lavish) {
    window.lavish.queuePrompt(prompt, { tag: 'tracked-batch', text: 'Findings: ' + items.length + ' dispositions', element: form, data: { question: 'findings', items } });
    setStatus(form, 'queued: ' + items.length + ' dispositions', 'queued');
    inline.hidden = true;
    return;
  }
  setStatus(form, 'answered (Lavish not connected)', 'sel');
  inline.hidden = false;
  inline.textContent = prompt;
}

function renderVerification() {
  const target = document.getElementById('verification');
  const { verification } = DATA;
  if (!verification?.rows?.length) {
    target.innerHTML = '';
    return;
  }
  const cell = (result) => {
    const cls = result === 'pass' ? 'res-pass' : /fail|error/i.test(result) ? 'res-warn' : '';
    return '<td class="' + cls + '">' + esc(result === 'pass' ? '✓ pass' : result) + '</td>';
  };
  target.innerHTML =
    '<h2>Verification</h2>' + (verification.lead ? '<p class="dim">' + esc(verification.lead) + '</p>' : '') +
    '<div class="tablewrap"><table><thead><tr><th>Check</th><th>Result</th><th></th></tr></thead><tbody>' +
    verification.rows
      .map(
        (row) =>
          '<tr><td>' + esc(row.check) + '</td>' + cell(row.result) +
          '<td class="askcell" data-askhost>' + askButton({ what: 'verification row', ref: row.check, quote: row.check + ': ' + row.result }) + '</td></tr>',
      )
      .join('') +
    '</tbody></table></div>';
}

const decisionState = new Map();

function decisionHtml(decision) {
  return (
    '<form class="dform" data-lavish-question="' + esc(decision.id) + '" data-decision="' + esc(decision.id) + '">' +
    '<div class="q"><span class="mono dim">' + esc(decision.id) + '</span> ' + esc(decision.title) + '</div>' +
    decision.options.map((option) => '<label class="opt"><input type="radio" name="choice" value="' + esc(option) + '"> <span>' + esc(option) + '</span></label>').join('') +
    '<textarea name="note" rows="2" placeholder="Optional note"></textarea>' +
    '<div class="actions"><button type="submit" class="btn">Queue answer</button><span class="pill" data-status>no answer</span></div>' +
    '<div class="inline-answer" data-inline hidden></div></form>'
  );
}

function renderDecisions() {
  const target = document.getElementById('decisions');
  const hasQuestions = DATA.decisions.length || allFindings.length;
  if (!hasQuestions) {
    target.innerHTML = '';
    return;
  }
  target.innerHTML =
    (DATA.decisions.length ? '<h2>Decisions</h2><div class="decisions">' + DATA.decisions.map(decisionHtml).join('') + '</div>' : '') +
    '<div class="copyrow"><div class="actions"><button type="button" class="btn ghost" id="copy-all">Copy all answers</button>' +
    '<span id="copy-status" role="status" aria-live="polite" class="dim"></span></div></div>';
}

function onDecisionChange(form) {
  const choice = new FormData(form).get('choice');
  if (!choice) return;
  const queued = decisionState.get(form.dataset.decision);
  setStatus(form, queued === choice ? 'queued: ' + choice : 'selected: ' + choice + ' (not queued)', queued === choice ? 'queued' : 'sel');
}

function onDecisionSubmit(form) {
  const id = form.dataset.decision;
  const decision = DATA.decisions.find((item) => item.id === id);
  const data = new FormData(form);
  const choice = data.get('choice');
  const note = String(data.get('note') || '').trim();
  const inline = form.querySelector('[data-inline]');
  if (!choice) {
    setStatus(form, 'pick an option first', 'sel');
    return;
  }
  const prompt = 'Decision ' + id + ' (' + decision.title + '): I chose "' + choice + '".' + (note ? ' Note: ' + note : '');
  decisionState.set(id, choice);
  if (window.lavish) {
    window.lavish.queuePrompt(prompt, { tag: 'decision', text: id + ': ' + choice, element: form, data: { question: id, answer: choice, note } });
    setStatus(form, 'queued: ' + choice, 'queued');
    inline.hidden = true;
    return;
  }
  setStatus(form, 'answered (Lavish not connected)', 'sel');
  inline.hidden = false;
  inline.textContent = prompt;
}

function collectAnswers() {
  return [...document.querySelectorAll('[data-lavish-question]')]
    .map((form) => {
      const lines = [];
      for (const field of form.querySelectorAll('input, select, textarea')) {
        if (field.matches('input[type=radio]') && !field.checked) continue;
        const value = field.value.trim();
        if (!value) continue;
        lines.push('  ' + (field.name || field.tagName.toLowerCase()) + ': ' + value);
      }
      return lines.length ? form.dataset.lavishQuestion + ':\n' + lines.join('\n') : null;
    })
    .filter(Boolean)
    .join('\n\n');
}

async function copyAll(button) {
  const status = document.getElementById('copy-status');
  const text = collectAnswers();
  if (!text) {
    status.textContent = 'No answers to copy yet.';
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    status.textContent = 'Answers copied.';
  } catch {
    button.closest('.copyrow').querySelector('textarea')?.remove();
    const manual = document.createElement('textarea');
    manual.value = text;
    manual.readOnly = true;
    manual.rows = Math.min(12, text.split('\n').length + 1);
    manual.setAttribute('aria-label', 'Answers to copy manually');
    button.closest('.copyrow').appendChild(manual);
    manual.select();
    status.textContent = 'Clipboard unavailable. Copy the answers below manually.';
  }
}

function renderUsage() {
  const target = document.getElementById('usage');
  const usage = DATA.usage;
  const built = 'Built ' + new Date(DATA.meta.generatedAt).toLocaleString();
  if (!usage) {
    target.innerHTML = '<span class="dim">' + esc(built) + '</span>';
    return;
  }
  const phases = (usage.phases ?? []).map((phase) => esc(phase.name) + ' ' + fmtMs(phase.ms) + ' / ' + fmtTokens(phase.input + phase.output)).join(' · ');
  target.innerHTML =
    '<span class="dim">' + esc(built) + '</span>' +
    '<span>Wall ' + fmtMs(usage.wallMs) + '</span>' +
    '<span>Tokens in ' + fmtTokens(usage.total.input) + ' <span class="dim">(' + fmtTokens(usage.total.cacheRead) + ' cached)</span>, out ' + fmtTokens(usage.total.output) + '</span>' +
    (usage.agents ? '<span>' + usage.agents + ' subagents</span>' : '') +
    (phases ? '<span class="dim">' + phases + '</span>' : '');
}

function renderNav() {
  renderStrip();
  renderSetList();
  renderChips();
  renderTree();
  renderSetHeader();
}

function selectSet(id) {
  state.set = id;
  if (state.fileKey && id !== 'all' && parseKey(state.fileKey).set.id !== id) {
    state.fileKey = null;
    state.cursorKey = null;
    state.selection = null;
    renderDiffPane();
  }
  renderNav();
}

function openFile(key) {
  const { set } = parseKey(key);
  if (state.set !== 'all' && state.set !== set.id) state.set = set.id;
  state.fileKey = key;
  state.cursorKey = key;
  state.selection = null;
  renderNav();
  renderDiffPane();
  document.querySelector('.row.sel')?.scrollIntoView({ block: 'nearest' });
}

function toggleViewed(key, force) {
  const next = force ?? !state.viewed.has(key);
  next ? state.viewed.add(key) : state.viewed.delete(key);
  persistViewed();
  renderSetList();
  renderTree();
  if (state.fileKey === key) renderDiffPane();
}

function moveCursor(delta) {
  const rows = [...document.querySelectorAll('#tree .file')];
  if (!rows.length) return;
  const current = rows.findIndex((row) => row.dataset.key === state.cursorKey);
  const next = Math.min(rows.length - 1, Math.max(0, current + delta));
  state.cursorKey = rows[next].dataset.key;
  renderTree();
  document.querySelector('#tree .row.cur')?.scrollIntoView({ block: 'nearest' });
}

function bindEvents() {
  document.addEventListener('click', (event) => {
    const target = event.target;
    const viewedBox = target.closest('[data-viewed]');
    if (viewedBox) return toggleViewed(viewedBox.dataset.viewed, viewedBox.checked);
    const viewedButton = target.closest('[data-toggle-viewed]');
    if (viewedButton) return toggleViewed(viewedButton.dataset.toggleViewed);
    const ask = target.closest('[data-ask]');
    if (ask) return openAskPanel(ask);
    if (target.closest('[data-ask-submit]')) return submitAskPanel(target.closest('[data-ask-submit]'));
    if (target.closest('[data-ask-cancel]')) return target.closest('.askpanel')?.remove();
    if (target.closest('[data-sel-clear]')) return clearSelection();
    const set = target.closest('[data-set]');
    if (set) return selectSet(set.dataset.set);
    const chip = target.closest('[data-tier]');
    if (chip) {
      const id = chip.dataset.tier;
      state.tiers.has(id) ? state.tiers.delete(id) : state.tiers.add(id);
      renderChips();
      renderSetHeader();
      return renderTree();
    }
    const open = target.closest('[data-open]');
    if (open) return openFile(open.dataset.open);
    const style = target.closest('[data-style]');
    if (style) {
      state.diffStyle = style.dataset.style;
      state.selection = null;
      return renderDiffPane();
    }
    const folder = target.closest('[data-folder]');
    if (folder) {
      const id = folder.dataset.folder;
      state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
      return renderTree();
    }
    const row = target.closest('#tree .file');
    if (row) return openFile(row.dataset.key);
    if (target.closest('#copy-all')) copyAll(target.closest('#copy-all'));
  });
  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (form.id === 'findings-form') {
      event.preventDefault();
      return onFindingsSubmit(form);
    }
    if (form.classList.contains('dform')) {
      event.preventDefault();
      onDecisionSubmit(form);
    }
  });
  document.addEventListener('change', (event) => {
    const form = event.target.closest('form.dform');
    if (form && event.target.name === 'choice') onDecisionChange(form);
  });
  document.addEventListener('mouseup', (event) => setTimeout(() => updateSelectionToolbar(event), 0));
  document.addEventListener('keyup', (event) => {
    if (event.key.startsWith('Arrow') || event.key === 'Shift') setTimeout(() => updateSelectionToolbar(event), 0);
  });
  document.getElementById('tree').addEventListener('keydown', (event) => {
    if (event.key === 'ArrowDown') moveCursor(1);
    else if (event.key === 'ArrowUp') moveCursor(-1);
    else if (event.key === 'Enter' && state.cursorKey) openFile(state.cursorKey);
    else if (event.key === 'v' && state.cursorKey) toggleViewed(state.cursorKey);
    else return;
    event.preventDefault();
  });
}

renderShell();
renderNav();
renderDiffPane();
renderFindings();
renderVerification();
renderDecisions();
renderUsage();
bindEvents();
</script>
